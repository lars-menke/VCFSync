name: iCloud Kontakte Export

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Kontakte exportieren
        env:
          ICLOUD_USER: ${{ secrets.ICLOUD_USER }}
          ICLOUD_PASS: ${{ secrets.ICLOUD_PASS }}
        run: python icloud_contacts.py export --output icloud_kontakte.vcf

      - name: VCF als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: icloud-kontakte-export
          path: icloud_kontakte.vcf
          retention-days: 7
