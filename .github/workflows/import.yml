name: iCloud Kontakte Import

on:
  workflow_dispatch:
    inputs:
      vcf_content:
        description: "VCF als Base64 (einzeilig) ODER roher VCF-Text. Das Feld ist einzeilig - mehrzeilige VCF bitte Base64-kodiert einfuegen."
        type: string
        required: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: VCF-Inhalt in Datei schreiben
        env:
          VCF_CONTENT: ${{ inputs.vcf_content }}
        run: |
          python3 - <<'EOF'
          import os, base64, sys
          raw = os.environ.get("VCF_CONTENT", "")
          # Das einzeilige workflow_dispatch-Feld entfernt Zeilenumbrueche.
          # Enthaelt der Input kein BEGIN:VCARD, wird Base64 erwartet und dekodiert.
          if "BEGIN:VCARD" not in raw:
              try:
                  raw = base64.b64decode(raw).decode("utf-8")
              except Exception as e:
                  print(f"Eingabe ist weder gueltige VCF noch Base64: {e}")
                  sys.exit(1)
          with open("import_input.vcf", "w", encoding="utf-8") as fh:
              fh.write(raw)
          n = raw.count("BEGIN:VCARD")
          print(f"import_input.vcf geschrieben - erkannte Karten: {n}")
          if n == 0:
              print("Keine vCard erkannt - Abbruch.")
              sys.exit(1)
          EOF

      - name: Kontakte importieren
        env:
          ICLOUD_USER: ${{ secrets.ICLOUD_USER }}
          ICLOUD_PASS: ${{ secrets.ICLOUD_PASS }}
        run: python icloud_contacts.py import --input import_input.vcf
